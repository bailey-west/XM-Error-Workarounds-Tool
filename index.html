<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XM Error Workarounds Tool</title>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Xfinity Mobile Inspired Theme */
        :root { 
            --xm-purple: #6138f5; 
            --xm-dark: #1f1f1f; 
            --xm-light: #f3f3f3; 
            --text: #1a1a1a; 
            --bg: #ffffff;
        }
        
        body { 
            font-family: 'Xfinity Standard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f8f9fa; 
            color: var(--text); 
            padding: 40px 20px;
            margin: 0;
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: var(--bg); 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
        }
        
        /* Header */
        h1 { font-weight: 700; letter-spacing: -0.5px; margin-bottom: 5px; color: black; }
        
        /* Navigation */
        .nav-tabs { display: flex; gap: 20px; border-bottom: 2px solid #eee; margin-bottom: 30px; padding-bottom: 0; }
        .nav-tabs button { 
            background: none; 
            border: none; 
            padding: 15px 0; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 500;
            color: #666; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            transition: color 0.2s;
            position: relative;
        }
        .nav-tabs button:hover { color: var(--xm-purple); }
        .nav-tabs button.active { color: var(--xm-purple); font-weight: 700; }
        .nav-tabs button.active::after { 
            content: ''; position: absolute; bottom: -2px; left: 0; right: 0; 
            height: 3px; background: var(--xm-purple); border-radius: 3px 3px 0 0; 
        }
        
        /* Inputs */
        label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #666; margin-bottom: 4px; display: block; }
        input, textarea { 
            width: 100%; padding: 16px; margin-bottom: 20px; 
            border: 1px solid #e0e0e0; border-radius: 8px; 
            font-size: 15px; background: #fafafa; transition: all 0.2s;
            box-sizing: border-box;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--xm-purple); background: white; box-shadow: 0 0 0 4px rgba(97, 56, 245, 0.1); }
        
        /* Buttons */
        button.btn { 
            padding: 14px 24px; border: none; border-radius: 50px; 
            cursor: pointer; font-weight: 600; font-size: 15px;
            display: inline-flex; align-items: center; gap: 8px; 
            transition: transform 0.1s, box-shadow 0.2s; 
        }
        button.btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--xm-purple); color: white; box-shadow: 0 4px 12px rgba(97, 56, 245, 0.3); }
        .btn-primary:hover { background: #4f2dc7; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-danger { background: #fff5f5; color: #d32f2f; }
        .btn-success { background: #e8f5e9; color: #2e7d32; }
        
        /* Search */
        .search-wrapper { position: relative; margin-bottom: 30px; }
        .search-wrapper input { padding-left: 50px; border-radius: 50px; border: 2px solid #eee; }
        .search-wrapper input:focus { border-color: var(--xm-purple); }
        .search-icon { position: absolute; left: 20px; top: 18px; color: #999; font-size: 20px; }
        
        /* Cards */
        .card { 
            border: 1px solid #eee; padding: 25px; margin-bottom: 20px; 
            border-radius: 12px; background: white; 
            transition: transform 0.2s, box-shadow 0.2s; 
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .card h3 { margin: 0 0 8px 0; color: var(--xm-dark); font-size: 18px; }
        .card p { color: #555; line-height: 1.5; margin: 0 0 15px 0; }
        .steps { 
            background: #f8f9fa; padding: 20px; border-radius: 8px; 
            font-family: -apple-system, sans-serif; color: #333; 
            line-height: 1.6; font-size: 15px;
        }
        
        /* Loading & Hidden */
        .hidden { display: none; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div style="margin-bottom: 30px;">
        <h1>XM Error Workarounds Tool</h1>
    </div>

    <div class="nav-tabs">
        <button onclick="switchTab('search')" class="active" id="tab-search">Find Workaround</button>
        <button onclick="switchTab('submit')" id="tab-submit">Submit New</button>
        <button onclick="switchTab('moderate')" id="tab-moderate">
            Queue <span id="badge" style="background:var(--xm-purple); color:white; padding:2px 8px; border-radius:12px; font-size:11px; margin-left:6px;">0</span>
        </button>
    </div>

    <div id="loading" style="text-align:center; padding:40px; color:#666;">Initializing...</div>

    <div id="view-search" class="hidden">
        <div class="search-wrapper">
            <i class="ph ph-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search by error message or symptoms..." onkeyup="renderList()">
        </div>
        <div id="approved-list"></div>
    </div>

    <div id="view-submit" class="hidden">
        <div style="text-align:center; margin-bottom:30px;">
            <h3>Submit a New Fix</h3>
            <p style="color:#666;">Enter your rough notes below. Our AI will automatically format and polish them when you submit.</p>
        </div>
        
        <div id="form-content">
            <label>Error Name / Title</label>
            <input type="text" id="inTitle" placeholder="e.g. Activation stuck on 'waiting for carrier'">
            
            <label>Symptoms</label>
            <textarea id="inDesc" rows="2" placeholder="What is the customer seeing?"></textarea>
            
            <label>Rough Steps (We'll format this for you)</label>
            <textarea id="inSteps" rows="5" placeholder="Just type what you did... e.g. 'i reset network settings then swapped sim'"></textarea>
            
            <div style="margin-top:20px; display:flex; gap:15px;">
                <button class="btn btn-secondary" onclick="clearForm()" style="flex:1;">Clear</button>
                <button class="btn btn-primary" id="submitBtn" onclick="submitWithAI()" style="flex:3; justify-content:center;">
                    <i class="ph ph-magic-wand"></i> Polish & Submit
                </button>
            </div>
        </div>
    </div>

    <div id="view-moderate" class="hidden">
        <h3>Manager Queue</h3>
        <p style="margin-bottom:20px; color:#666;">Review and approve rep submissions.</p>
        <div id="pending-list"></div>
    </div>
</div>

<div id="overlay" class="loading-overlay hidden">
    <i class="ph ph-spinner ph-spin" style="font-size:40px; color:var(--xm-purple); margin-bottom:15px;"></i>
    <div id="overlay-text" style="font-weight:600; color:#333;">AI is polishing your submission...</div>
</div>

<script type="module">
    // --- FIREBASE SETUP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBI7Bf9nLzdcT3CRcz7bFjnOEGyN5Y_EWI",
        authDomain: "xm-errors-tool.firebaseapp.com",
        projectId: "xm-errors-tool",
        storageBucket: "xm-errors-tool.firebasestorage.app",
        messagingSenderId: "855317746690",
        appId: "1:855317746690:web:a0df2990df8e28367dc31b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'default-app-id';

    let localWorkarounds = [];
    let isManager = false; // Simple local check

    // --- AUTH & DATA ---
    onAuthStateChanged(auth, (user) => {
        if (user) setupDataListener();
        else signInAnonymously(auth);
    });

    function setupDataListener() {
        const fixesRef = collection(db, 'artifacts', appId, 'public', 'data', 'workarounds');
        onSnapshot(fixesRef, (snapshot) => {
            localWorkarounds = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('view-search').classList.remove('hidden');
            renderList();
        });
    }

    // --- NAVIGATION & MANAGER LOCK ---
    window.switchTab = function(tabName) {
        if (tabName === 'moderate' && !isManager) {
            const pw = prompt("Enter Manager Password:");
            if (pw === "xm2026") {
                isManager = true;
            } else {
                alert("Incorrect password.");
                return;
            }
        }
        
        ['search', 'submit', 'moderate'].forEach(t => {
            document.getElementById(`view-${t}`).classList.add('hidden');
            document.getElementById(`tab-${t}`).classList.remove('active');
        });
        document.getElementById(`view-${tabName}`).classList.remove('hidden');
        document.getElementById(`tab-${tabName}`).classList.add('active');
        renderList();
    }

    // --- SUBMISSION LOGIC (INTEGRATED AI) ---
    window.submitWithAI = async function() {
        const title = document.getElementById('inTitle').value;
        const desc = document.getElementById('inDesc').value;
        const steps = document.getElementById('inSteps').value;

        if(!title || !steps) return alert("Please fill in Title and Steps.");

        // Show loading
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');

        let finalTitle = title;
        let finalDesc = desc;
        let finalSteps = steps;

        // 1. Call AI
        try {
            const prompt = `
                You are an editor for a technical knowledge base.
                Please rewrite this submission to be professional, clear, and concise.
                
                IMPORTANT: Format the 'steps' as a clear, bulleted list (using - or *).
                
                Input Title: ${title}
                Input Desc: ${desc}
                Input Steps: ${steps}

                Return JSON: { "title": "...", "desc": "...", "steps": "..." }
            `;

            const response = await fetch("/.netlify/functions/ai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: [{ role: "user", content: prompt }] })
            });

            if(response.ok) {
                const data = await response.json();
                const content = JSON.parse(data.choices[0].message.content);
                finalTitle = content.title;
                finalDesc = content.desc;
                finalSteps = content.steps;
            } else {
                console.warn("AI skipped due to error, submitting raw.");
            }
        } catch (e) {
            console.error("AI Error", e);
        }

        // 2. Save to Firebase
        try {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'workarounds'), {
                title: finalTitle,
                desc: finalDesc,
                steps: finalSteps,
                status: "pending",
                createdAt: new Date().toISOString(),
                aiPolished: true
            });
            
            overlay.classList.add('hidden');
            alert("Success! Your fix has been polished and sent to the manager queue.");
            window.clearForm();
            window.switchTab('search');
            
        } catch (e) {
            overlay.classList.add('hidden');
            alert("Error saving: " + e.message);
        }
    }

    window.clearForm = function() {
        document.getElementById('inTitle').value = '';
        document.getElementById('inDesc').value = '';
        document.getElementById('inSteps').value = '';
    }

    // --- RENDER LOGIC ---
    window.renderList = function() {
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        const approvedContainer = document.getElementById('approved-list');
        const pendingContainer = document.getElementById('pending-list');
        
        approvedContainer.innerHTML = '';
        pendingContainer.innerHTML = '';
        
        let pendingCount = 0;

        localWorkarounds.forEach(item => {
            // Manager Queue
            if (item.status === 'pending') {
                pendingCount++;
                pendingContainer.innerHTML += createCard(item, true);
            } 
            // Public Search
            else if (item.status === 'approved') {
                if (item.title.toLowerCase().includes(searchVal) || item.desc.toLowerCase().includes(searchVal)) {
                    approvedContainer.innerHTML += createCard(item, false);
                }
            }
        });

        document.getElementById('badge').innerText = pendingCount;
        if(approvedContainer.innerHTML === '') approvedContainer.innerHTML = '<div style="text-align:center; color:#999; margin-top:40px;">No workarounds found.</div>';
    }

    function createCard(item, isPending) {
        // Convert markdown bullets to HTML breaks for display if needed, or rely on pre-wrap
        return `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:start;">
                    <h3>${item.title}</h3>
                    ${item.aiPolished ? '<i class="ph ph-sparkle" style="color:var(--xm-purple);" title="AI Polished"></i>' : ''}
                </div>
                <p>${item.desc}</p>
                <div class="steps" style="white-space: pre-wrap;">${item.steps}</div>
                ${isPending ? `
                    <div style="margin-top:20px; border-top:1px solid #eee; padding-top:15px; display:flex; gap:10px;">
                        <button class="btn btn-success" style="font-size:13px; padding:8px 16px;" onclick="approve('${item.id}')">Approve</button>
                        <button class="btn btn-danger" style="font-size:13px; padding:8px 16px;" onclick="reject('${item.id}')">Reject</button>
                    </div>` : ''}
            </div>
        `;
    }

    // --- DB ACTIONS ---
    window.approve = async (id) => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'workarounds', id), { status: "approved" });
    window.reject = async (id) => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'workarounds', id));

</script>
</body>
</html>
